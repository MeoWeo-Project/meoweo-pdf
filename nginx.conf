# Serves the static build. The headers here must stay in step with public/_headers, which is what
# Cloudflare Pages reads - the two are the same contract for two different hosts.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WebAssembly must be served with its own type or browsers refuse to stream-compile it.
    types { application/wasm wasm; }
    include /etc/nginx/mime.types;

    # 'wasm-unsafe-eval' and worker-src are load-bearing: without them every export fails.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # `expires`, never `add_header Cache-Control` - an add_header inside a location DISCARDS every
    # header inherited from the server block, which silently drops the CSP on exactly the assets
    # that need it. This trap cost a debugging round; do not "tidy" these back into add_header.
    location /assets/ {
        expires 1y;
    }
    location /models/ {
        expires 1y;
    }
    location = /index.html {
        expires -1;
    }

    # SPA fallback: the History-API router mints real paths, so unknown ones serve the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
